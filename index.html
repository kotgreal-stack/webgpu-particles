<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Tunnel <style>
        * { margin:</title>
    0; padding: 0; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info { position: absolute; top: 20px; left: 20px; color: #fff; font-family: 'Courier New', monospace; z-index: 100; }
        #title { font-size: 28px; font-weight: bold; text-shadow: 0 0 20px #0ff; }
    </style>
</head>
<body>
    <div id="info">
        <div id="title">🌀 WARP TUNNEL</div>
    </div>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        let W, H;
        let particles = [];
        const num = 2000;
        
        const colors = ['#00ffff', '#ff00ff', '#00ff88', '#ff0066', '#6600ff'];
        
        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
        }
        
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = (Math.random() - 0.5) * W * 2;
                this.y = (Math.random() - 0.5) * H * 2;
                this.z = Math.random() * 500 + 50;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.trail = [];
            }
            
            update(speed) {
                this.z -= speed;
                
                if (this.z < 1) {
                    this.reset();
                    this.z = 500;
                }
                
                this.trail.push({x: this.x, y: this.y, z: this.z});
                if (this.trail.length > 15) this.trail.shift();
            }
            
            draw() {
                const scale = 400 / this.z;
                const sx = this.x * scale + W / 2;
                const sy = this.y * scale + H / 2;
                const size = Math.max(0.5, (500 - this.z) / 100);
                
                if (sx < 0 || sx > W || sy < 0 || sy > H) return;
                
                // Draw trail
                x.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const ts = 400 / t.z;
                    const tx = t.x * ts + W / 2;
                    const ty = t.y * ts + H / 2;
                    if (i === 0) x.moveTo(tx, ty);
                    else x.lineTo(tx, ty);
                }
                x.strokeStyle = this.color;
                x.globalAlpha = 0.3;
                x.lineWidth = size;
                x.stroke();
                
                // Draw star
                x.beginPath();
                x.arc(sx, sy, size, 0, Math.PI * 2);
                x.fillStyle = this.color;
                x.globalAlpha = Math.min(1, (500 - this.z) / 200);
                x.fill();
                
                // Glow
                x.beginPath();
                x.arc(sx, sy, size * 3, 0, Math.PI * 2);
                const g = x.createRadialGradient(sx, sy, 0, sx, sy, size * 3);
                g.addColorStop(0, this.color);
                g.addColorStop(1, 'transparent');
                x.fillStyle = g;
                x.globalAlpha = 0.5;
                x.fill();
            }
        }
        
        function init() {
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < num; i++) particles.push(new Star());
            animate();
        }
        
        let speed = 8;
        let targetSpeed = 8;
        
        document.addEventListener('click', () => {
            targetSpeed = targetSpeed === 8 ? 25 : 8;
        });
        
        document.addEventListener('mousemove', (e) => {
            const mx = (e.clientX - W/2) / W;
            const my = (e.clientY - H/2) / H;
            for (let p of particles) {
                p.x += mx * 2;
                p.y += my * 2;
            }
        });
        
        function animate() {
            requestAnimationFrame(animate);
            
            x.fillStyle = 'rgba(0, 0, 0, 0.15)';
            x.fillRect(0, 0, W, H);
            
            speed += (targetSpeed - speed) * 0.05;
            
            for (let p of particles) {
                p.update(speed);
                p.draw();
            }
            
            x.globalAlpha = 1;
        }
        
        init();
    </script>
</body>
</html>
