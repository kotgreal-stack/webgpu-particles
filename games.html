<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 80%, rgba(255,100,0,0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(0,255,100,0.1) 0%, transparent 50%), #000;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #f60, #ff0, #f60);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s linear infinite;
        }
        @keyframes glow { to { background-position: 200% center; } }
        .subtitle { color: #888; margin-bottom: 3rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            padding: 1rem;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #f60;
            box-shadow: 0 15px 40px rgba(255,100,0,0.25);
        }
        .card .emoji { font-size: 3rem; display: block; margin-bottom: 1rem; }
        .card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .card p { color: #666; font-size: 0.9rem; }
        .footer { text-align: center; padding: 2rem; color: #444; font-size: 0.8rem; }
        .footer a { color: #f60; }
        .back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Labs</a>
    <div class="hero">
        <h1>🎮 GAMES</h1>
        <p class="subtitle">Playable Browser Games</p>
        <div class="grid">
            <a href="void.html" class="card">
                <span class="emoji">🕳️</span>
                <h2>VOID</h2>
                <p>One-tap dodging survival. Tap to change direction.</p>
            </a>
            <a href="snake.html" class="card">
                <span class="emoji">🐍</span>
                <h2>Snake</h2>
                <p>Classic snake game. Arrow keys to move.</p>
            </a>
            <a href="pong.html" class="card">
                <span class="emoji">🏓</span>
                <h2>Pong</h2>
                <p>Classic paddle game. Mouse to control.</p>
            </a>
            <a href="asteroids.html" class="card">
                <span class="emoji">☄️</span>
                <h2>Asteroids</h2>
                <p>Spaceship shooter. Arrow keys + Space.</p>
            </a>
        </div>
        <div class="footer">
            <p>Built with JavaScript | <a href="https://github.com/kotgreal-stack">GitHub</a></p>
        </div>
    </div>
</body>
</html>
