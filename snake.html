<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; }
        canvas { border: 2px solid #0f0; }
        #info { position: absolute; top: 20px; color: #0f0; text-align: center; }
    </style>
</head>
<body>
    <div id="info">
        <h1>🐍 SNAKE</h1>
        <p>Arrow keys to move • Space to pause</p>
        <p id="score">Score: 0</p>
    </div>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        const scoreEl = document.getElementById('score');
        
        const grid = 20;
        const cols = 30, rows = 20;
        c.width = cols * grid;
        c.height = rows * grid;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 10};
        let dir = {x: 1, y: 0};
        let nextDir = {x: 1, y: 0};
        let score = 0;
        let gameOver = false;
        let paused = false;
        
        function placeFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows)
            };
            // Don't place on snake
            for (let s of snake) {
                if (s.x === food.x && s.y === food.y) placeFood();
            }
        }
        
        function update() {
            if (gameOver || paused) return;
            
            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            
            // Wall collision
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                gameOver = true;
                return;
            }
            
            // Self collision
            for (let s of snake) {
                if (s.x === head.x && s.y === head.y) {
                    gameOver = true;
                    return;
                }
            }
            
            snake.unshift(head);
            
            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }
        }
        
        function draw() {
            x.fillStyle = '#000';
            x.fillRect(0, 0, c.width, c.height);
            
            // Grid
            x.strokeStyle = '#111';
            for (let i = 0; i <= cols; i++) {
                x.beginPath(); x.moveTo(i*grid, 0); x.lineTo(i*grid, c.height); x.stroke();
            }
            for (let i = 0; i <= rows; i++) {
                x.beginPath(); x.moveTo(0, i*grid); x.lineTo(c.width, i*grid); x.stroke();
            }
            
            // Food
            x.fillStyle = '#f00';
            x.shadowBlur = 10;
            x.shadowColor = '#f00';
            x.fillRect(food.x * grid + 2, food.y * grid + 2, grid - 4, grid - 4);
            
            // Snake
            for (let i = 0; i < snake.length; i++) {
                const s = snake[i];
                x.fillStyle = i === 0 ? '#0f0' : '#0a0';
                x.shadowBlur = i === 0 ? 15 : 0;
                x.shadowColor = '#0f0';
                x.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
            }
            x.shadowBlur = 0;
            
            // Game over
            if (gameOver) {
                x.fillStyle = 'rgba(0,0,0,0.7)';
                x.fillRect(0, 0, c.width, c.height);
                x.fillStyle = '#f00';
                x.font = 'bold 30px monospace';
                x.textAlign = 'center';
                x.fillText('GAME OVER', c.width/2, c.height/2);
                x.fillStyle = '#fff';
                x.font = '16px monospace';
                x.fillText('Press SPACE to restart', c.width/2, c.height/2 + 30);
            }
            
            // Paused
            if (paused && !gameOver) {
                x.fillStyle = '#ff0';
                x.font = 'bold 30px monospace';
                x.textAlign = 'center';
                x.fillText('PAUSED', c.width/2, c.height/2);
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameOver) {
                    snake = [{x: 10, y: 10}];
                    dir = {x: 1, y: 0};
                    nextDir = {x: 1, y: 0};
                    score = 0;
                    scoreEl.textContent = 'Score: 0';
                    gameOver = false;
                    placeFood();
                } else {
                    paused = !paused;
                }
            }
            if (paused || gameOver) return;
            if (e.code === 'ArrowUp' && dir.y !== 1) nextDir = {x: 0, y: -1};
            if (e.code === 'ArrowDown' && dir.y !== -1) nextDir = {x: 0, y: 1};
            if (e.code === 'ArrowLeft' && dir.x !== 1) nextDir = {x: -1, y: 0};
            if (e.code === 'ArrowRight' && dir.x !== -1) nextDir = {x: 1, y: 0};
        });
        
        placeFood();
        setInterval(() => { update(); draw(); }, 100);
    </script>
</body>
</html>
