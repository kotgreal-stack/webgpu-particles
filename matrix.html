<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        let W, H;
        let drops = [];
        const fontSize = 14;
        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF$+-*/="%#&_.,;:!?|()[]{}<>^~';
        
        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
            const cols = Math.floor(W / fontSize);
            // Reset drops array to match columns
            drops = [];
            for (let i = 0; i < cols; i++) {
                drops.push(Math.random() * -H); // Start at random positions above screen
            }
        }
        
        function draw() {
            // Semi-transparent black for trail effect
            x.fillStyle = 'rgba(0, 0, 0, 0.08)';
            x.fillRect(0, 0, W, H);
            
            x.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const y = drops[i];
                
                // Green gradient based on position
                const brightness = (y / H) * 255;
                x.fillStyle = `rgb(0, ${Math.min(255, brightness + 100)}, 0)`;
                x.fillText(char, i * fontSize, y);
                
                // Move drop down
                drops[i] += fontSize * 0.8;
                
                // Reset to top with random chance
                if (y > H && Math.random() > 0.975) {
                    drops[i] = -fontSize;
                }
            }
        }
        
        resize();
        window.addEventListener('resize', resize);
        setInterval(draw, 35);
    </script>
</body>
</html>
