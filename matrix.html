<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        
        let W, H;
        let columns = [];
        const fontSize = 12;
        const chars = '0123456789ABCDEF$+-*/="%#&_.,;:!?|()[]{}<>アイウエオカキクケコサシスセソ';
        
        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
            
            const numCols = Math.floor(W / fontSize);
            columns = [];
            
            for (let i = 0; i < numCols; i++) {
                columns.push({
                    y: Math.random() * H,
                    speed: 0.5 + Math.random() * 2
                });
            }
        }
        
        function draw() {
            // Clear with semi-transparent black
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, W, H);
            
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const char = chars[Math.floor(Math.random() * chars.length)];
                
                // Draw green character
                const brightness = Math.floor(Math.random() * 155) + 100;
                ctx.fillStyle = 'rgb(0, ' + brightness + ', 0)';
                ctx.fillText(char, i * fontSize, col.y);
                
                // Move down
                col.y += col.speed * fontSize;
                
                // Reset to top with small random chance
                if (col.y > H && Math.random() < 0.02) {
                    col.y = -fontSize;
                    col.speed = 0.5 + Math.random() * 2;
                }
            }
        }
        
        resize();
        window.addEventListener('resize', resize);
        
        function loop() {
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
