<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const fontSize = 14;
        const chars = '0123456789ABCDEF$+-*/="%#&_.,;:!?|()[]{}<>アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        
        let columns = [];
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            const numColumns = Math.ceil(width / fontSize);
            columns = [];
            for (let i = 0; i < numColumns; i++) {
                columns[i] = Math.random() * -height;
            }
        }
        
        function draw() {
            // Semi-transparent fade
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < columns.length; i++) {
                const char = chars.charAt(Math.floor(Math.random() * chars.length));
                const y = columns[i];
                
                // Green color
                const green = Math.floor(Math.random() * 155) + 100;
                ctx.fillStyle = 'rgb(0, ' + green + ', 0)';
                
                ctx.fillText(char, i * fontSize, y);
                
                // Move down
                columns[i] += fontSize * 0.8;
                
                // Reset when off screen
                if (columns[i] > height && Math.random() > 0.975) {
                    columns[i] = -fontSize;
                }
            }
            
            requestAnimationFrame(draw);
        }
        
        resize();
        window.addEventListener('resize', resize);
        draw();
    </script>
</body>
</html>
