<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Spiral - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        let W, H;
        let stars = [];
        const num = 3000;
        
        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
        }
        
        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * Math.min(W, H) * 0.4;
                this.x = Math.cos(angle) * dist;
                this.y = Math.sin(angle) * dist;
                this.z = Math.random() * 100;
                this.orbitSpeed = 0.002 + (1 - dist / (Math.min(W, H) * 0.4)) * 0.01;
                this.brightness = Math.random();
            }
            update() {
                const angle = Math.atan2(this.y, this.x) + this.orbitSpeed;
                const dist = Math.sqrt(this.x * this.x + this.y * this.y);
                this.x = Math.cos(angle) * dist;
                this.y = Math.sin(angle) * dist;
                this.z -= 0.1;
                if (this.z < 1) this.z = 100;
            }
            draw(centerX, centerY) {
                const scale = 100 / this.z;
                const sx = this.x * scale + centerX;
                const sy = this.y * scale + centerY;
                const size = Math.max(0.5, (100 - this.z) / 30) * this.brightness;
                
                if (sx < 0 || sx > W || sy < 0 || sy > H) return;
                
                const dist = Math.sqrt(this.x * this.x + this.y * this.y);
                
                x.beginPath();
                x.arc(sx, sy, size, 0, Math.PI * 2);
                x.fillStyle = `hsla(${260 + dist * 0.2}, 80%, ${60 + this.brightness * 40}%, ${this.brightness})`;
                x.fill();
            }
        }
        
        function init() {
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < num; i++) stars.push(new Star());
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            x.fillStyle = 'rgba(0, 0, 0, 0.1)';
            x.fillRect(0, 0, W, H);
            x.globalCompositeOperation = 'lighter';
            
            const centerX = W / 2;
            const centerY = H / 2;
            
            for (let s of stars) {
                s.update();
                s.draw(centerX, centerY);
            }
            
            x.globalCompositeOperation = 'source-over';
        }
        
        init();
    </script>
</body>
</html>
