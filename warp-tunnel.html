<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Tunnel - CyberCraft Labs</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            z-index: 100;
            pointer-events: none;
        }
        #title { font-size: 24px; font-weight: bold; text-shadow: 0 0 20px #0ff; }
        #hint { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="info">
        <div id="title">🌀 WARP TUNNEL</div>
        <div id="hint">Click to warp • Move mouse to steer</div>
    </div>
    <canvas id="c"></canvas>
    <script>
        const c = document.getElementById('c');
        const x = c.getContext('2d');
        let W, H;
        let stars = [];
        const num = 1500;
        
        const colors = ['#00ffff', '#ff00ff', '#00ff88', '#ff0066', '#6600ff'];
        
        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
        }
        
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * W * 3;
                this.y = (Math.random() - 0.5) * H * 3;
                this.z = Math.random() * 400 + 20;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.trail = [];
            }
            update(speed) {
                this.z -= speed;
                if (this.z < 1) this.reset();
                this.trail.push({x: this.x, y: this.y, z: this.z});
                if (this.trail.length > 12) this.trail.shift();
            }
            draw() {
                const scale = 400 / this.z;
                const sx = this.x * scale + W / 2;
                const sy = this.y * scale + H / 2;
                const size = Math.max(0.5, (400 - this.z) / 80);
                
                if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;
                
                // Trail
                x.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const ts = 400 / t.z;
                    const tx = t.x * ts + W / 2;
                    const ty = t.y * ts + H / 2;
                    if (i === 0) x.moveTo(tx, ty);
                    else x.lineTo(tx, ty);
                }
                x.strokeStyle = this.color;
                x.globalAlpha = 0.2;
                x.lineWidth = size;
                x.stroke();
                
                // Star
                x.beginPath();
                x.arc(sx, sy, size, 0, Math.PI * 2);
                x.fillStyle = this.color;
                x.globalAlpha = Math.min(1, (400 - this.z) / 150);
                x.fill();
                
                // Glow
                x.beginPath();
                x.arc(sx, sy, size * 2, 0, Math.PI * 2);
                const g = x.createRadialGradient(sx, sy, 0, sx, sy, size * 2);
                g.addColorStop(0, this.color);
                g.addColorStop(1, 'transparent');
                x.fillStyle = g;
                x.globalAlpha = 0.4;
                x.fill();
            }
        }
        
        function init() {
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < num; i++) stars.push(new Star());
            animate();
        }
        
        let speed = 6;
        let targetSpeed = 6;
        
        window.addEventListener('click', () => {
            targetSpeed = targetSpeed === 6 ? 20 : 6;
        });
        
        window.addEventListener('touchstart', () => {
            targetSpeed = targetSpeed === 6 ? 20 : 6;
        });
        
        window.addEventListener('mousemove', (e) => {
            const mx = (e.clientX - W/2) / W;
            const my = (e.clientY - H/2) / H;
            for (let s of stars) {
                s.x += mx * 3;
                s.y += my * 3;
            }
        });
        
        function animate() {
            requestAnimationFrame(animate);
            x.fillStyle = 'rgba(0, 0, 0, 0.2)';
            x.fillRect(0, 0, W, H);
            
            speed += (targetSpeed - speed) * 0.05;
            
            for (let s of stars) {
                s.update(speed);
                s.draw();
            }
            
            x.globalAlpha = 1;
        }
        
        init();
    </script>
</body>
</html>
